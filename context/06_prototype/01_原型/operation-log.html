<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作日志 · sili-smart-hr</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.13.5/dist/index.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #app {
      height: 100%;
      display: flex;
    }

    /* ========== 设计系统变量 ========== */
    :root {
      --primary-color: #1890ff;
      --primary-color-hover: #40a9ff;
      --primary-color-active: #096dd9;

      --sidebar-bg-start: #001529;
      --sidebar-bg-end: #002140;
      --sidebar-text: rgba(255, 255, 255, 0.65);
      --sidebar-text-hover: #fff;
      --sidebar-active-bg: rgba(24, 144, 255, 0.15);
      --sidebar-active-border: #1890ff;

      --content-bg: #f0f2f5;
      --card-bg: #fff;
      --card-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px 0 rgba(0, 0, 0, 0.02);
      --card-shadow-hover: 0 1px 2px -2px rgba(0, 0, 0, 0.16), 0 3px 6px 0 rgba(0, 0, 0, 0.12), 0 5px 12px 4px rgba(0, 0, 0, 0.09);

      --text-primary: #262626;
      --text-regular: #595959;
      --text-secondary: #8c8c8c;

      --border-color: #f0f0f0;
      --border-color-split: #e8e8e8;

      --table-header-bg: #fafafa;

      --success-color: #52c41a;
      --warning-color: #faad14;
      --danger-color: #ff4d4f;
      --info-color: #1890ff;

      --border-radius: 6px;
      --border-radius-lg: 8px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;

      --sidebar-width: 220px;
      --sidebar-width-collapsed: 64px;
      --header-height: 56px;
    }

    /* ========== 左侧菜单样式 ========== */
    .sidebar {
      width: 220px;
      height: 100%;
      background: linear-gradient(180deg, var(--sidebar-bg-start) 0%, var(--sidebar-bg-end) 100%);
      transition: width 0.3s cubic-bezier(0.2, 0, 0, 1);
      flex-shrink: 0;
      box-shadow: 2px 0 8px 0 rgba(29, 35, 41, 0.05);
      display: flex;
      flex-direction: column;
    }

    .sidebar.collapsed {
      width: 64px;
    }

    .sidebar-header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .sidebar-header .logo {
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-header .logo::before {
      content: 'S';
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: var(--primary-color);
      border-radius: 6px;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0;
    }

    .sidebar.collapsed .sidebar-header .logo {
      font-size: 0;
    }

    .sidebar-menu {
      border-right: none;
      background: transparent;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-menu:not(.el-menu--collapse) {
      width: 220px;
    }

    .sidebar-menu::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-menu::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
    }

    .sidebar-menu::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .sidebar-menu .el-menu-item,
    .sidebar-menu .el-sub-menu__title {
      height: 46px;
      line-height: 46px;
      color: var(--sidebar-text);
      padding-left: 22px !important;
      margin: 4px 8px;
      border-radius: var(--border-radius);
      transition: all 0.2s ease;
    }

    .sidebar-menu .el-menu-item .el-icon,
    .sidebar-menu .el-sub-menu__title .el-icon {
      color: var(--sidebar-text);
      font-size: 16px;
      margin-right: 10px;
      transition: color 0.2s ease;
    }

    .sidebar-menu .el-menu-item:hover,
    .sidebar-menu .el-sub-menu__title:hover {
      background-color: rgba(255, 255, 255, 0.06);
      color: var(--sidebar-text-hover);
    }

    .sidebar-menu .el-menu-item:hover .el-icon,
    .sidebar-menu .el-sub-menu__title:hover .el-icon {
      color: var(--sidebar-text-hover);
    }

    .sidebar-menu .el-menu-item.is-active {
      background: var(--sidebar-active-bg);
      color: var(--sidebar-text-hover);
      border-left: 3px solid var(--sidebar-active-border);
      margin-left: 5px;
      padding-left: 17px !important;
    }

    .sidebar-menu .el-menu-item.is-active .el-icon {
      color: var(--primary-color);
    }

    .sidebar-menu .el-sub-menu.is-opened > .el-sub-menu__title {
      color: var(--sidebar-text-hover);
    }

    .sidebar-menu .el-sub-menu.is-opened > .el-sub-menu__title .el-icon {
      color: var(--sidebar-text-hover);
    }

    .sidebar-menu .el-sub-menu .el-menu {
      background: rgba(0, 0, 0, 0.12);
    }

    .sidebar-menu .el-sub-menu .el-menu-item {
      height: 40px;
      line-height: 40px;
      padding-left: 52px !important;
      min-width: auto;
      font-size: 13px;
    }

    .sidebar-menu .el-sub-menu .el-menu-item.is-active {
      padding-left: 45px !important;
    }

    .sidebar-menu .el-sub-menu__title .el-sub-menu__icon-arrow {
      color: var(--sidebar-text);
      font-size: 12px;
      margin-top: -2px;
    }

    /* ========== 右侧主区域 ========== */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: var(--content-bg);
    }

    /* ========== 顶栏 ========== */
    .header {
      height: 56px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 1px 4px rgba(0, 21, 41, 0.08);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-left .collapse-btn {
      cursor: pointer;
      padding: 8px;
      border-radius: var(--border-radius);
      transition: all 0.2s ease;
      color: var(--text-regular);
      display: flex;
      align-items: center;
    }

    .header-left .collapse-btn:hover {
      background: rgba(0, 0, 0, 0.025);
      color: var(--primary-color);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-right .notification {
      cursor: pointer;
      padding: 8px;
      border-radius: var(--border-radius);
      transition: all 0.2s ease;
      color: var(--text-regular);
      display: flex;
      align-items: center;
    }

    .header-right .notification:hover {
      background: rgba(0, 0, 0, 0.025);
      color: var(--primary-color);
    }

    .header-right .notification .el-badge__content {
      border: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: var(--border-radius);
      transition: all 0.2s ease;
    }

    .user-info:hover {
      background: rgba(0, 0, 0, 0.025);
    }

    .user-info .username {
      font-size: 14px;
      color: var(--text-primary);
      font-weight: 500;
    }

    .user-info .el-icon {
      color: var(--text-secondary);
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    .user-info:hover .el-icon {
      color: var(--primary-color);
    }

    /* ========== 内容区 ========== */
    .content-wrapper {
      flex: 1;
      padding: 24px;
      overflow: auto;
    }

    .breadcrumb-wrapper .el-breadcrumb__item:first-child .el-breadcrumb__inner {
      color: var(--primary-color);
      font-weight: 500;
    }

    /* ========== 通用面板 ========== */
    .panel {
      background: var(--card-bg);
      border-radius: var(--border-radius-lg);
      padding: 20px 24px;
      box-shadow: var(--card-shadow);
      margin-bottom: 20px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      position: relative;
      padding-left: 12px;
    }

    .panel-title::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 16px;
      background: var(--primary-color);
      border-radius: 2px;
    }

    .panel-sub {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ========== 筛选区 ========== */
    .filter-form .el-form-item {
      margin-bottom: 0;
      margin-right: 12px;
    }

    .filter-form .el-form-item__label {
      color: var(--text-regular);
      font-weight: 500;
    }

    /* ========== 表格区 ========== */
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .table-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      position: relative;
      padding-left: 12px;
    }

    .table-title::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 16px;
      background: var(--primary-color);
      border-radius: 2px;
    }

    .el-table {
      --el-table-border-color: var(--border-color);
      --el-table-header-bg-color: var(--table-header-bg);
    }

    .el-table th.el-table__cell {
      background: #fafafa;
      color: var(--text-primary);
      font-weight: 600;
    }

    .summary-cell {
      color: var(--text-regular);
      font-size: 13px;
    }

    /* ========== 分页 ========== */
    .pagination-wrapper {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    /* ========== 详情弹窗变更对比 ========== */
    .detail-section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 4px 0 12px;
      padding-left: 10px;
      border-left: 3px solid var(--primary-color);
      line-height: 1;
    }

    .change-before {
      color: var(--danger-color);
      text-decoration: line-through;
      text-decoration-color: rgba(255, 77, 79, 0.5);
    }

    .change-after {
      color: var(--success-color);
      font-weight: 600;
    }

    .detail-text {
      padding: 14px 16px;
      background: #fafafa;
      border-radius: var(--border-radius);
      font-size: 13px;
      color: var(--text-regular);
      line-height: 1.8;
      border-left: 3px solid var(--border-color-split);
    }

    /* ========== 按钮与输入框圆角 ========== */
    .el-button {
      border-radius: var(--border-radius);
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .el-button--primary {
      --el-button-bg-color: var(--primary-color);
      --el-button-border-color: var(--primary-color);
      --el-button-hover-bg-color: var(--primary-color-hover);
      --el-button-hover-border-color: var(--primary-color-hover);
      --el-button-active-bg-color: var(--primary-color-active);
      --el-button-active-border-color: var(--primary-color-active);
    }

    .el-button:focus {
      outline: none;
    }

    .el-input__wrapper,
    .el-select__wrapper,
    .el-date-editor .el-input__wrapper {
      border-radius: var(--border-radius);
    }

    .el-dropdown-menu__item {
      padding: 8px 16px;
      font-size: 14px;
    }

    .el-dropdown-menu__item .el-icon {
      margin-right: 8px;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        z-index: 1000;
        height: 100%;
      }

      .sidebar.collapsed {
        width: 0;
        padding: 0;
      }

      .content-wrapper {
        padding: 16px;
      }

      .filter-form .el-form-item {
        margin-bottom: 12px;
      }

      .pagination-wrapper {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 左侧菜单 -->
    <aside :class="['sidebar', { collapsed: isCollapse }]">
      <div class="sidebar-header">
        <span class="logo">{{ isCollapse ? '' : 'sili-smart-hr' }}</span>
      </div>
      <el-menu
        :default-active="activeMenu"
        class="sidebar-menu"
        :collapse="isCollapse"
        :collapse-transition="false"
        :default-openeds="openedKeys"
        background-color="transparent"
        text-color="#bfcbd9"
        active-text-color="#1890ff"
        @select="handleMenuSelect"
      >
        <template v-for="group in menuGroups" :key="group.key">
          <el-sub-menu v-if="group.children.length > 1" :index="group.key">
            <template #title>
              <el-icon><component :is="group.icon"></component></el-icon>
              <span>{{ group.title }}</span>
            </template>
            <el-menu-item v-for="child in group.children" :key="child.index" :index="child.index">
              {{ child.title }}
            </el-menu-item>
          </el-sub-menu>
          <el-menu-item v-else :index="group.children[0].index">
            <el-icon><component :is="group.icon"></component></el-icon>
            <template #title>{{ group.children[0].title }}</template>
          </el-menu-item>
        </template>
      </el-menu>
    </aside>

    <!-- 右侧主区域 -->
    <main class="main-container">
      <!-- 顶栏 -->
      <header class="header">
        <div class="header-left">
          <div class="collapse-btn" @click="toggleCollapse">
            <el-icon :size="20"><component :is="isCollapse ? 'Expand' : 'Fold'"></component></el-icon>
          </div>
          <el-breadcrumb separator="/" class="breadcrumb-wrapper">
            <el-breadcrumb-item>sili-smart-hr</el-breadcrumb-item>
            <el-breadcrumb-item>系统配置</el-breadcrumb-item>
            <el-breadcrumb-item>操作日志</el-breadcrumb-item>
          </el-breadcrumb>
        </div>

        <div class="header-right">

          <el-dropdown @command="handleUserCommand">
            <div class="user-info">
              <el-avatar :size="32" style="background: var(--primary-color);">{{ avatarText }}</el-avatar>
              <span class="username">{{ currentUser.name }}</span>
              <el-icon><ArrowDown></ArrowDown></el-icon>
            </div>
            <template #dropdown>
              <el-dropdown-menu>
                <el-dropdown-item command="profile">
                  <el-icon><User></User></el-icon>个人中心
                </el-dropdown-item>
                <el-dropdown-item divided command="logout">
                  <el-icon><SwitchButton></SwitchButton></el-icon>退出登录
                </el-dropdown-item>
              </el-dropdown-menu>
            </template>
          </el-dropdown>
        </div>
      </header>

      <!-- 内容区 -->
      <div class="content-wrapper">
        <!-- 筛选区 -->
        <section class="panel">
          <el-form :inline="true" :model="filterForm" class="filter-form">
            <el-form-item label="操作人">
              <el-input
                v-model="filterForm.operator"
                placeholder="姓名"
                clearable
                style="width: 180px;"
                @keyup.enter="handleSearch"
              ></el-input>
            </el-form-item>
            <el-form-item label="操作类型">
              <el-select v-model="filterForm.type" placeholder="全部类型" clearable style="width: 160px;">
                <el-option
                  v-for="opt in typeOptions"
                  :key="opt.value"
                  :label="opt.label"
                  :value="opt.value"
                ></el-option>
              </el-select>
            </el-form-item>
            <el-form-item label="操作结果">
              <el-select v-model="filterForm.result" placeholder="全部" clearable style="width: 120px;">
                <el-option label="成功" value="success"></el-option>
                <el-option label="失败" value="fail"></el-option>
              </el-select>
            </el-form-item>
            <el-form-item label="时间范围">
              <el-date-picker
                v-model="filterForm.dateRange"
                type="daterange"
                range-separator="至"
                start-placeholder="开始日期"
                end-placeholder="结束日期"
                style="width: 260px;"
                value-format="YYYY-MM-DD"
              ></el-date-picker>
            </el-form-item>
            <el-form-item>
              <el-button type="primary" @click="handleSearch">
                <el-icon><Search></Search></el-icon>查询
              </el-button>
              <el-button @click="handleReset">
                <el-icon><Refresh></Refresh></el-icon>重置
              </el-button>
            </el-form-item>
          </el-form>
        </section>

        <!-- 表格区 -->
        <section class="panel">
          <div class="table-header">
            <div style="display: flex; align-items: center; gap: 12px;">
              <span class="table-title">操作日志</span>
              <span class="panel-sub">共 {{ pagination.total }} 条记录</span>
            </div>
            <el-button @click="handleExport">
              <el-icon><Download></Download></el-icon>导出日志
            </el-button>
          </div>

          <el-table :data="pagedData" stripe border v-loading="loading" style="width: 100%;">
            <el-table-column prop="time" label="时间" width="160" align="center"></el-table-column>
            <el-table-column prop="operator" label="操作人" min-width="100" align="center"></el-table-column>
            <el-table-column label="操作类型" width="120" align="center">
              <template #default="{ row }">
                <el-tag :type="typeTagType(row.type)" size="small" effect="light">{{ row.typeName }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="target" label="操作对象" min-width="180" show-overflow-tooltip></el-table-column>
            <el-table-column label="详情摘要" min-width="260">
              <template #default="{ row }">
                <span class="summary-cell">{{ row.summary }}</span>
              </template>
            </el-table-column>
            <el-table-column label="结果" width="90" align="center">
              <template #default="{ row }">
                <el-tag :type="row.result === 'success' ? 'success' : 'danger'" size="small" effect="dark">{{ row.result === 'success' ? '成功' : '失败' }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="100" align="center" fixed="right">
              <template #default="{ row }">
                <el-button type="primary" link size="small" @click="openDetail(row)">
                  <el-icon><View></View></el-icon>详情
                </el-button>
              </template>
            </el-table-column>
          </el-table>

          <div class="pagination-wrapper">
            <el-pagination
              v-model:current-page="pagination.currentPage"
              v-model:page-size="pagination.pageSize"
              :page-sizes="[10, 20, 50]"
              :total="pagination.total"
              layout="total, sizes, prev, pager, next, jumper"
              @size-change="handleSizeChange"
              @current-change="handlePageChange"
            ></el-pagination>
          </div>
        </section>
      </div>
    </main>

    <!-- 详情弹窗 -->
    <el-dialog v-model="detailDialog" title="操作详情" width="640px">
      <template v-if="current">
        <div class="detail-section-title">基本信息</div>
        <el-descriptions :column="2" border>
          <el-descriptions-item label="操作时间">{{ current.time }}</el-descriptions-item>
          <el-descriptions-item label="操作结果">
            <el-tag :type="current.result === 'success' ? 'success' : 'danger'" size="small" effect="dark">{{ current.result === 'success' ? '成功' : '失败' }}</el-tag>
          </el-descriptions-item>
          <el-descriptions-item label="操作人">{{ current.operator }}</el-descriptions-item>
          <el-descriptions-item label="操作类型">
            <el-tag :type="typeTagType(current.type)" size="small" effect="light">{{ current.typeName }}</el-tag>
          </el-descriptions-item>
          <el-descriptions-item label="操作对象">{{ current.target }}</el-descriptions-item>
          <el-descriptions-item label="来源 IP">{{ current.ip }}</el-descriptions-item>
          <el-descriptions-item label="操作终端">{{ current.client }}</el-descriptions-item>
        </el-descriptions>

        <div style="margin-top: 20px;">
          <div class="detail-section-title">变更详情</div>
          <el-table v-if="current.changes && current.changes.length" :data="current.changes" border size="small">
            <el-table-column prop="field" label="字段" width="160"></el-table-column>
            <el-table-column label="变更前">
              <template #default="{ row }">
                <span class="change-before">{{ row.before }}</span>
              </template>
            </el-table-column>
            <el-table-column width="50" align="center">
              <template #default>
                <el-icon color="#8c8c8c"><Right></Right></el-icon>
              </template>
            </el-table-column>
            <el-table-column label="变更后">
              <template #default="{ row }">
                <span class="change-after">{{ row.after }}</span>
              </template>
            </el-table-column>
          </el-table>
          <div v-else class="detail-text">{{ current.detail }}</div>
        </div>
      </template>

      <template #footer>
        <el-button type="primary" @click="detailDialog = false">关闭</el-button>
      </template>
    </el-dialog>
  </div>

  <script src="https://unpkg.com/vue@3.4.0/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus@2.13.5"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1"></script>
  <script>
    const { createApp, ref, reactive, computed, onMounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const app = createApp({
      setup() {
        // ========== 用户 ==========
        const currentUser = computed(() => ({ name: '张敏' }));
        const avatarText = computed(() => currentUser.value.name.charAt(0));

        // ========== 统一导航菜单 ==========
        const menuGroups = [
          {
            key: 'workbench', title: '工作台', icon: 'Odometer',
            children: [{ index: 'workbench', title: '工作台首页', href: 'index.html' }]
          },
          {
            key: 'insight', title: '结果洞察', icon: 'DataAnalysis',
            children: [
              { index: 'team-dashboard', title: '团队看板', href: 'team-dashboard.html' },
              { index: 'profile-list', title: '人员画像', href: 'profile-list.html' }
            ]
          },
          {
            key: 'assessment', title: '评估运营', icon: 'Promotion',
            children: [
              { index: 'assessment-center', title: '评测运营中心', href: 'assessment-batch-list.html' }
            ]
          },
          {
            key: 'model', title: '能力模型', icon: 'Operation',
            children: [
              { index: 'dimension-config-list', title: '维度与权重', href: 'dimension-config-list.html' },
              { index: 'question-bank-list', title: '题库管理', href: 'question-bank-list.html' }
            ]
          },
          {
            key: 'system', title: '系统配置', icon: 'Setting',
            children: [
              { index: 'system-config', title: '系统参数', href: 'system-config.html' },
              { index: 'secret-config', title: '大模型配置', href: 'secret-config.html' },
              { index: 'user-list', title: '用户管理', href: 'user-list.html' },
              { index: 'operation-log', title: '操作日志', href: 'operation-log.html' }
            ]
          }
        ];

        const routeMap = {};
        menuGroups.forEach(g => g.children.forEach(c => { routeMap[c.index] = c.href; }));

        const openedKeys = ['insight', 'assessment', 'model', 'system'];
        const activeMenu = ref('operation-log');

        const handleMenuSelect = (index) => {
          if (routeMap[index]) {
            window.location.href = routeMap[index];
          }
        };

        // ========== 侧栏折叠 ==========
        const isCollapse = ref(false);
        const toggleCollapse = () => { isCollapse.value = !isCollapse.value; };

        // ========== 顶栏交互 ==========
        const todoCount = ref(4);
        const go = (href) => { window.location.href = href; };

        const handleUserCommand = (command) => {
          if (command === 'logout') {
            ElMessageBox.confirm('确定要退出登录吗？', '提示', {
              confirmButtonText: '确定',
              cancelButtonText: '取消',
              type: 'warning'
            }).then(() => {
              window.location.href = 'login.html';
            }).catch(() => {});
          } else if (command === 'profile') {
            ElMessage.info('演示入口，该功能在原型中暂未实现');
          }
        };

        // ========== 类型映射 ==========
        const typeOptions = [
          { value: 'config', label: '配置变更' },
          { value: 'operation', label: '评估运营' },
          { value: 'test', label: '测试管理' },
          { value: 'secret', label: '大模型配置' }
        ];

        const typeTagType = (t) => {
          const map = { config: 'warning', operation: '', test: 'success', secret: 'danger' };
          return map[t] || '';
        };

        // ========== 日志数据 ==========
        const loading = ref(false);
        const logs = ref([
          {
            id: 1, time: '2026-08-07 10:32', operator: '张敏',
            type: 'config', typeName: '配置变更', target: '维度「任务适配判断力」聚合权重',
            summary: '聚合权重由 0.2 调整为 0.3，下次评估生效',
            detail: '将能力模型「AI 使用能力 · 底层 · 任务适配判断力」的聚合权重由 0.2 调整为 0.3，调整将在 2026-08-10 评估区间生效。',
            result: 'success', ip: '10.2.1.34', client: 'Chrome / Windows',
            changes: [{ field: '聚合权重', before: '0.2', after: '0.3' }]
          },
          {
            id: 2, time: '2026-08-07 09:50', operator: '张敏',
            type: 'operation', typeName: '评估运营', target: '手动定向分析 · 张伟',
            summary: '对张伟发起定向分析，时段 2026-07-01 至 2026-08-07',
            detail: '手动触发对张伟的定向评估，对象范围单人，时段 2026-07-01 至 2026-08-07，评估维度范围默认全部，已立即执行并入评估队列。',
            result: 'success', ip: '10.2.1.34', client: 'Chrome / Windows',
            changes: []
          },
          {
            id: 3, time: '2026-08-06 16:10', operator: '李婷',
            type: 'test', typeName: '测试管理', target: '题库审核 · AI 管理题批次 QB20260806',
            summary: '审核入库 24 题，驳回 3 题，标记驳回原因「情境不清晰」',
            detail: '对 AI 管理能力题生成批次 QB20260806 进行批量审核，共 27 题，其中 24 题默认通过入库、3 题标记驳回（原因：情境描述不清晰），入库后进入启用状态。',
            result: 'success', ip: '10.2.1.35', client: 'Edge / Windows',
            changes: []
          },
          {
            id: 5, time: '2026-08-06 08:05', operator: '孙伟',
            type: 'secret', typeName: '大模型配置', target: '大模型配置 · 主力模型',
            summary: '将启用模型由「备用模型」切换为「主力模型」',
            detail: '切换当前启用的大模型，平台所有 AI 调用统一切换至「主力模型」，原启用的「备用模型」转为停用，服务无中断。',
            result: 'success', ip: '10.2.1.36', client: 'Chrome / macOS',
            changes: [{ field: '启用模型', before: '备用模型（通义千问）', after: '主力模型（DeepSeek）' }]
          },
          {
            id: 9, time: '2026-08-03 17:30', operator: '李婷',
            type: 'test', typeName: '测试管理', target: '测试任务 · T20260805（李芳 · 九型人格）',
            summary: '逾期 2 天未作答，任务已取消',
            detail: '测试任务 T20260805 长期逾期未作答且作答链接已失效，按规则取消任务，并在通知中心记录。',
            result: 'success', ip: '10.2.1.35', client: 'Edge / Windows',
            changes: []
          },
          {
            id: 10, time: '2026-08-03 15:42', operator: '张敏',
            type: 'config', typeName: '配置变更', target: '题库管理 · 新增九型量表题目',
            summary: '新增失败：数据校验未通过（必填项缺失）',
            detail: '尝试新增九型量表题目时，因「选项 a/b 权重」必填项缺失导致数据校验未通过，操作未生效，请补全后重试。',
            result: 'fail', ip: '10.2.1.34', client: 'Chrome / Windows',
            changes: []
          },
          {
            id: 12, time: '2026-08-01 23:15', operator: '评估引擎',
            type: 'operation', typeName: '评估运营', target: '评估任务 · 07-27 至 08-02',
            summary: 'AI 使用能力评估区间完成，处理本期会话 312 条',
            detail: '07-27 至 08-02 评估区间执行完成，处理本期会话 312 条，全员画像已更新。',
            result: 'success', ip: '内网调度节点', client: '系统任务',
            changes: []
          }
        ]);

        // ========== 筛选与分页 ==========
        const filterForm = reactive({ operator: '', type: '', result: '', dateRange: null });
        const pagination = reactive({ currentPage: 1, pageSize: 10, total: 0 });

        const filteredLogs = computed(() => {
          return logs.value.filter(item => {
            if (filterForm.operator) {
              const kw = filterForm.operator.trim().toLowerCase();
              if (!item.operator.toLowerCase().includes(kw)) return false;
            }
            if (filterForm.type && item.type !== filterForm.type) return false;
            if (filterForm.result && item.result !== filterForm.result) return false;
            if (filterForm.dateRange && filterForm.dateRange.length === 2) {
              const t = new Date(item.time.replace(/-/g, '/'));
              const s = new Date(filterForm.dateRange[0].replace(/-/g, '/'));
              const e = new Date(filterForm.dateRange[1].replace(/-/g, '/'));
              e.setHours(23, 59, 59);
              if (t < s || t > e) return false;
            }
            return true;
          });
        });

        const pagedData = computed(() => {
          pagination.total = filteredLogs.value.length;
          const start = (pagination.currentPage - 1) * pagination.pageSize;
          return filteredLogs.value.slice(start, start + pagination.pageSize);
        });

        const handleSearch = () => {
          pagination.currentPage = 1;
          ElMessage.success('查询完成');
        };

        const handleReset = () => {
          filterForm.operator = '';
          filterForm.type = '';
          filterForm.result = '';
          filterForm.dateRange = null;
          pagination.currentPage = 1;
          ElMessage.info('已重置筛选条件');
        };

        const handleSizeChange = (size) => { pagination.pageSize = size; pagination.currentPage = 1; };
        const handlePageChange = (page) => { pagination.currentPage = page; };

        const handleExport = () => { ElMessage.success('正在导出日志，请稍候...'); };

        // ========== 详情弹窗 ==========
        const detailDialog = ref(false);
        const current = ref(null);

        const openDetail = (row) => {
          current.value = row;
          detailDialog.value = true;
        };

        // ========== 初始化 ==========
        onMounted(() => {
          loading.value = true;
          setTimeout(() => { loading.value = false; }, 300);
        });

        return {
          isCollapse, toggleCollapse,
          activeMenu, openedKeys, menuGroups, handleMenuSelect,
          todoCount, go, handleUserCommand,
          currentUser, avatarText,
          typeOptions, typeTagType,
          loading, filterForm, pagination, pagedData,
          handleSearch, handleReset, handleSizeChange, handlePageChange, handleExport,
          detailDialog, current, openDetail
        };
      }
    });

    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }

    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
