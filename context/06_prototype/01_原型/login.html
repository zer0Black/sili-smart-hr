<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · sili-smart-hr</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.13.5/dist/index.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    :root {
      --primary-color: #1890ff;
      --primary-color-hover: #40a9ff;
      --primary-color-active: #096dd9;
      --content-bg: #f0f2f5;
      --card-bg: #fff;
      --card-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px 0 rgba(0, 0, 0, 0.02);
      --text-primary: #262626;
      --text-regular: #595959;
      --text-secondary: #8c8c8c;
      --border-color: #f0f0f0;
      --border-radius: 6px;
      --border-radius-lg: 8px;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8efff 0%, #f0f5ff 45%, #e6f7ff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 32px 16px;
    }

    /* 背景装饰色斑 */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    .bg-orb.one {
      width: 420px;
      height: 420px;
      left: -120px;
      bottom: -120px;
      background: radial-gradient(circle, rgba(24, 144, 255, 0.28) 0%, rgba(24, 144, 255, 0) 70%);
    }

    .bg-orb.two {
      width: 360px;
      height: 360px;
      right: -100px;
      top: -100px;
      background: radial-gradient(circle, rgba(19, 194, 194, 0.22) 0%, rgba(19, 194, 194, 0) 70%);
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(24, 144, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 144, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* 主容器 */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    /* 品牌区 */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand-logo .mark {
      width: 44px;
      height: 44px;
      background: var(--primary-color);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(24, 144, 255, 0.35);
    }

    .brand-logo .name {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .brand-tagline {
      font-size: 14px;
      color: var(--text-regular);
      letter-spacing: 1px;
    }

    /* 登录卡片 */
    .login-card {
      border-radius: var(--border-radius-lg);
      border: none;
      box-shadow: 0 8px 30px rgba(0, 21, 41, 0.08);
      overflow: hidden;
    }

    .login-card .el-card__body {
      padding: 32px 32px 24px;
    }

    .login-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .login-form .el-form-item {
      margin-bottom: 18px;
    }

    .login-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .login-row .forgot {
      font-size: 13px;
      color: var(--primary-color);
      text-decoration: none;
      cursor: pointer;
    }

    .login-row .forgot:hover {
      color: var(--primary-color-hover);
    }

    .login-btn {
      width: 100%;
      height: 42px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    /* 演示入口 */
    .demo-entry {
      margin-top: 24px;
      padding: 18px 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      border: 1px dashed rgba(24, 144, 255, 0.3);
      border-radius: var(--border-radius-lg);
    }

    .demo-entry .demo-label {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .demo-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    /* 页脚 */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    /* 按钮与输入框圆角 */
    .el-button {
      border-radius: var(--border-radius);
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .el-button--primary {
      --el-button-bg-color: var(--primary-color);
      --el-button-border-color: var(--primary-color);
      --el-button-hover-bg-color: var(--primary-color-hover);
      --el-button-hover-border-color: var(--primary-color-hover);
      --el-button-active-bg-color: var(--primary-color-active);
      --el-button-active-border-color: var(--primary-color-active);
    }

    .el-input__wrapper {
      border-radius: var(--border-radius);
    }

    .login-form .el-input__wrapper {
      padding: 4px 11px;
    }

    @media (max-width: 480px) {
      .brand-logo .name {
        font-size: 22px;
      }

      .login-card .el-card__body {
        padding: 24px 20px 18px;
      }

      .demo-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-orb one"></div>
  <div class="bg-orb two"></div>

  <div id="app" class="login-wrapper">
    <!-- 品牌区 -->
    <div class="brand">
      <div class="brand-logo">
        <span class="mark">S</span>
        <span class="name">sili-smart-hr</span>
      </div>
      <div class="brand-tagline">AI 驱动的综合人才测评平台</div>
    </div>

    <!-- 登录卡片 -->
    <el-card class="login-card" shadow="never">
      <div class="login-title">账号登录</div>
      <div class="login-sub">请输入账号与密码进入主平台</div>

      <el-form ref="loginFormRef" :model="loginForm" :rules="loginRules" class="login-form" label-position="top" @submit.prevent="submitLogin">
        <el-form-item prop="account">
          <el-input v-model="loginForm.account" placeholder="请输入账号" size="large" clearable>
            <template #prefix>
              <el-icon><User></User></el-icon>
            </template>
          </el-input>
        </el-form-item>

        <el-form-item prop="password">
          <el-input v-model="loginForm.password" type="password" placeholder="请输入密码" size="large" show-password>
            <template #prefix>
              <el-icon><Lock></Lock></el-icon>
            </template>
          </el-input>
        </el-form-item>

        <div class="login-row">
          <el-checkbox v-model="loginForm.remember">记住我</el-checkbox>
          <span class="forgot" @click="handleForgot">忘记密码？</span>
        </div>

        <el-button type="primary" class="login-btn" :loading="submitLoading" @click="submitLogin">登 录</el-button>
      </el-form>
    </el-card>

    <!-- 演示入口 -->
    <div class="demo-entry">
      <div class="demo-label">演 示 入 口 · 快 速 体 验</div>
      <div class="demo-buttons">
        <el-button type="primary" @click="enterDemo">
          <el-icon style="margin-right: 6px;"><Avatar></Avatar></el-icon>进入系统（演示）
        </el-button>
      </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
      © 2026 sili-smart-hr · 综合人才测评平台<br>
      使用即代表同意《用户协议》与《隐私政策》
    </div>
  </div>

  <script src="https://unpkg.com/vue@3.4.0/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus@2.13.5"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1"></script>
  <script>
    const { createApp, ref, reactive } = Vue;
    const { ElMessage } = ElementPlus;

    const app = createApp({
      setup() {
        const loginFormRef = ref(null);
        const submitLoading = ref(false);

        const loginForm = reactive({
          account: '',
          password: '',
          remember: true
        });

        const loginRules = {
          account: [
            { required: true, message: '请输入账号', trigger: 'blur' }
          ],
          password: [
            { required: true, message: '请输入密码', trigger: 'blur' },
            { min: 6, message: '密码长度不少于 6 位', trigger: 'blur' }
          ]
        };

        const enterPlatform = () => {
          window.location.href = 'index.html';
        };

        const submitLogin = async () => {
          if (!loginFormRef.value) return;
          try {
            await loginFormRef.value.validate();
            submitLoading.value = true;
            // 模拟登录请求
            setTimeout(() => {
              submitLoading.value = false;
              ElMessage.success('登录成功，正在进入工作台');
              enterPlatform();
            }, 600);
          } catch (error) {
            ElMessage.error('请检查账号与密码是否填写正确');
          }
        };

        const enterDemo = () => {
          ElMessage.success('正在进入工作台');
          enterPlatform();
        };

        const handleForgot = () => {
          ElMessage.info('演示原型，忘记密码请联系系统管理员重置');
        };

        return {
          loginFormRef,
          loginForm,
          loginRules,
          submitLoading,
          submitLogin,
          enterDemo,
          handleForgot
        };
      }
    });

    // 注册所有 Element Plus 图标组件
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }

    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
